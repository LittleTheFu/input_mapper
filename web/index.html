<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>键鼠映射 · 原型</title>
<style>
  :root { color-scheme: dark; --bg:#211b1c; --panel:#302527; --line:#76524b; --peach:#e8b28d; --cream:#f4d6b5; --mint:#9ce3a7; --muted:#ba9b91; }
  * { box-sizing:border-box }
  body { margin:0; min-height:100vh; background:radial-gradient(ellipse at 50% 10%,#563b3d,#261f21 65%); color:var(--cream); font:15px/1.5 "Segoe UI","Microsoft YaHei",sans-serif; }
  main { width:min(1360px,96vw); margin:auto; padding:20px 0 24px; }
  header { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:20px; }
  h1 { margin:0; font-size:22px; letter-spacing:.08em; font-weight:650 }
  .header-controls { display:flex; align-items:center; gap:18px }
  .skin-picker { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12px }
  .skin-picker select { border:1px solid #785950; border-radius:7px; padding:7px 10px; background:#392c2d; color:var(--cream); font:13px "Segoe UI","Microsoft YaHei",sans-serif }
  .status { color:var(--mint); font:12px/1.4 Consolas,monospace; letter-spacing:.12em }
  .status::before { content:""; display:inline-block; width:8px;height:8px;border-radius:50%;background:var(--mint);margin-right:9px;box-shadow:0 0 10px #9ce3a7 }
  .layout { display:grid; grid-template-columns:minmax(0,1fr) minmax(340px,34%); gap:20px; margin-top:18px; }
  .panel { border:1px solid #785950; border-radius:14px; background:#392c2dce; padding:18px; box-shadow:0 10px 25px #100b0b55 }
  h2 { margin:0 0 14px; color:#f2c9a2; font-size:14px; font-weight:600; letter-spacing:.08em }
  .keyboard { display:grid; width:100%; gap:clamp(3px,.65cqw,6px); user-select:none }
  .row { display:flex; gap:clamp(2px,.55cqw,6px); justify-content:center }
  .key { flex:var(--key-units,1) 1 0; min-width:0; height:auto; aspect-ratio:1; display:grid; place-items:center; border:1px solid #9e725b; border-radius:clamp(4px,.8cqw,7px); background:linear-gradient(#e5b48f,#bb876a); color:#392824; box-shadow:0 3px 0 #755343; font:600 clamp(8px,1.5cqw,12px) Consolas,monospace; transition:transform .05s,filter .08s,background .08s; }
  .key.space { max-width:none }
  .key.down { transform:translateY(3px); box-shadow:0 0 0 #755343; background:var(--mint); filter:brightness(1.08) }
  .key.dim { opacity:.55 }
  .side { display:flex; flex-direction:column; gap:14px; min-height:0 }
  .side>.panel { flex:1; display:flex; flex-direction:column; min-height:0 }
  .mousepad { flex:1; min-height:360px; height:auto; border-radius:12px; background:linear-gradient(145deg,#705048,#3d2b2d); border:1px solid #9b7060; position:relative; overflow:hidden; cursor:crosshair }
  .mouse { display:none }
  .mouse-hand { position:absolute; left:50%;top:55%; width:210px; height:135px; transform:translate(-65%,-21%); background-image:url("mouse-hand-sprites.png");background-repeat:no-repeat;background-size:200% 100%;background-position:0% 50%;pointer-events:none;transition:left .045s linear,top .045s linear,filter .08s;filter:drop-shadow(0 3px 2px #1c111155); }
  .mouse-hand.left-click { background-position:100% 50%;filter:brightness(1.04) drop-shadow(0 3px 2px #1c111155) }
  .mouse-hand.right-click { background-position:100% 50%;filter:brightness(1.04) drop-shadow(0 3px 2px #1c111155) }
  .mouse-hand.scroll-wheel { animation:scroll-bob .24s ease-in-out 2 }
  @keyframes scroll-bob { 50% { transform:translate(-65%,-23%) } }
  .hint,.event { color:var(--muted); font-size:12px }
  .event { min-height:34px; padding:8px 10px; border-radius:8px; background:#20191a; color:#d1ad9c; font:12px Consolas,monospace }
  .keyboard-deck { position:relative; container-type:inline-size; }
  .hands-stage { position:relative; width:100%; aspect-ratio:1920 / 819; margin-top:clamp(-125px,-16cqw,-60px); overflow:visible; pointer-events:none; z-index:3; }
  .keyboard-hand { position:absolute;top:0;width:50%;height:100%;background-repeat:no-repeat;background-size:200% 100%;transition:transform .12s ease,background-image .08s; }
  .keyboard-hand.left { left:0;background-position:left center;background-image:url("keyboard-hands-idle.png"); }
  .keyboard-hand.right { right:0;background-position:right center;background-image:url("keyboard-hands-idle.png"); }
  .skin { fill:#e9b393; stroke:#754d42; stroke-width:2.2; stroke-linejoin:round; }
  .shade { fill:#d99677; opacity:.55 }
  .nail { fill:#f6d1b8; stroke:#b97862; stroke-width:1.2 }
  .cuff { fill:#f2d9c1; stroke:#9f7161; stroke-width:2 }
  .cuff-line { fill:none; stroke:#bd8d76; stroke-width:2 }
  .ribbon { fill:#35282a; stroke:#d79a5c; stroke-width:1.4 }
  .flower { fill:#e58a38; stroke:#7c4e39; stroke-width:1 }
  .finger { transform-box:fill-box; transform-origin:50% 100%; transition:transform .12s ease,filter .11s ease; }
  .finger.down { filter:brightness(1.12) }
  .hand-palm { transition:filter .12s; }
  .keyboard-finger-legend { display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:8px;color:#c0a39a;font-size:11px }
  .keyboard-finger-legend span::before { content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#d69a76;margin-right:5px }
  footer { margin-top:14px; color:#b89a90; font-size:12px }
  @media(max-width:900px){main{width:96vw}.layout{grid-template-columns:1fr}.side{display:block}.side>.panel{min-height:420px}.mousepad{height:320px;min-height:320px;flex:none}}
</style>
</head>
<body>
<main>
  <header><h1>键鼠映射 <span style="color:#d49472">/ INPUT VISUALIZER</span></h1><div class="header-controls"><label class="skin-picker" for="skinSelect">手部皮肤<select id="skinSelect"><option value="classic">经典款</option><option value="blue">蓝发角色</option><option value="cel90">蓝发角色 · 90年代赛璐璐</option></select></label><div class="status" id="status">LISTENING · 全局键鼠已激活</div></div></header>
  <div class="layout">
    <section class="panel"><h2>键盘输入</h2><div class="keyboard-deck"><div class="keyboard" id="keyboard"></div>
      <div class="hands-stage" id="handsStage" aria-label="键盘手部动作示意"><div class="keyboard-hand left" id="leftHand" role="img" aria-label="左手"></div><div class="keyboard-hand right" id="rightHand" role="img" aria-label="右手"></div></div>
      <div class="keyboard-finger-legend">按下键位时，对应手切换姿势并移到键帽位置</div>
      <div class="event" id="keyEvent">最近按键：—</div>
      </div>
    </section>
    <aside class="side">
      <section class="panel"><h2>鼠标输入</h2><div class="mousepad" id="mousepad"><div class="mouse" id="mouse"></div><div class="mouse-hand" id="mouseHand" aria-label="鼠标手部动作示意"></div></div><div class="event" id="mouseEvent">等待鼠标输入</div></section>
    </aside>
  </div>
</main>
<script>
const rows=[['ESC','1','2','3','4','5','6','7','8','9','0','-','=','BACK'],['TAB','Q','W','E','R','T','Y','U','I','O','P','[',']','\\'],['CAPS','A','S','D','F','G','H','J','K','L',';','\'','ENTER'],['SHIFT','Z','X','C','V','B','N','M',',','.','/','SHIFT'],['CTRL','WIN','ALT','SPACE','ALT','FN','MENU','CTRL']];
const kb=document.getElementById('keyboard'); const keyEls=new Map(),codeEls=new Map();
const keyUnits=label=>label==='SPACE'?4:['BACK','TAB','CAPS','ENTER'].includes(label)?1.5:label==='SHIFT'?2:1;
const maxRowUnits=Math.max(...rows.map(row=>row.reduce((sum,label)=>sum+keyUnits(label),0)));
const modifierCodes={SHIFT:['ShiftLeft','ShiftRight'],CTRL:['ControlLeft','ControlRight'],ALT:['AltLeft','AltRight'],WIN:['MetaLeft']};
rows.forEach((row,ri)=>{const line=document.createElement('div');line.className='row';const rowUnits=row.reduce((sum,label)=>sum+keyUnits(label),0);line.style.width=`${rowUnits/maxRowUnits*100}%`;const seen={};row.forEach(label=>{const b=document.createElement('div');b.className='key';b.style.setProperty('--key-units',keyUnits(label));b.textContent=label; if(['BACK','TAB','CAPS','ENTER'].includes(label))b.classList.add('w2');if(label==='SHIFT')b.classList.add('w3');if(label==='SPACE')b.classList.add('space');line.appendChild(b);const k=label==='SPACE'?' ':label.toLowerCase();keyEls.set(k,b);const occurrence=seen[label]||0;seen[label]=occurrence+1;const code=modifierCodes[label]?.[occurrence];if(code)codeEls.set(code,b)});kb.appendChild(line)});
const special={' ':'SPACE','Backspace':'BACK','Tab':'TAB','CapsLock':'CAPS','Enter':'ENTER','Shift':'SHIFT','Control':'CTRL','Alt':'ALT','Meta':'WIN','ArrowUp':'↑','ArrowDown':'↓','ArrowLeft':'←','ArrowRight':'→'};
const keyEvent=document.getElementById('keyEvent'), mouseEvent=document.getElementById('mouseEvent');let active=true;
function displayKey(e){return special[e.key]||e.key.toUpperCase()}
const fingerMap={lp:'1qaz',lr:'2wsx',lm:'3edc',li:'45rtfgvb',ri:'67yuhjnm',rm:'8ik,',rr:'9ol.',rp:'0p[]\\;\'/',lt:' ',rt:' '};
function mappedFingers(k){if(k===' ')return ['lt','rt'];for(const [finger,keys] of Object.entries(fingerMap))if(finger!=='lt'&&finger!=='rt'&&keys.includes(k))return [finger];return []}
const poseNames={lp:'left-pinky',lr:'left-ring',lm:'left-middle',li:'left-index',lt:'left-thumb',rp:'right-pinky',rr:'right-ring',rm:'right-middle',ri:'right-index',rt:'right-thumb'};
for(const prefix of ['','blue-','cel90-'])Object.values(poseNames).concat(['idle']).forEach(n=>{const img=new Image();img.src=`keyboard-hands-${prefix}${n}.png`});
['mouse-hand-sprites.png','mouse-hand-right-click-sprites.png','mouse-hand-blue-sprites.png','mouse-hand-blue-right-click-sprites.png','mouse-hand-cel90-sprites.png','mouse-hand-cel90-right-click-sprites.png'].forEach(src=>{const img=new Image();img.src=src});
// X values are local to each hand's half of the sprite canvas; the right-hand half starts at source x=960.
const pressedTipAnchors={lp:[485,155],lr:[565,140],lm:[660,135],li:[835,198],lt:[882,280],rp:[475,155],rr:[375,140],rm:[280,135],ri:[125,190],rt:[78,275]};
let activeSkin='classic';
function keyboardAsset(pose){const prefix=activeSkin==='blue'?'blue-':activeSkin==='cel90'?'cel90-':'';return `keyboard-hands-${prefix}${pose}.png`}
function mouseAsset(rightClick=false){const prefix=activeSkin==='blue'?'blue-':activeSkin==='cel90'?'cel90-':'';return rightClick?`mouse-hand-${prefix}right-click-sprites.png`:`mouse-hand-${prefix}sprites.png`}
const activeHandPoses=new Map();
function showHandPose(id,keyEl){activeHandPoses.set(id,keyEl);const handId=id[0]==='l'?'leftHand':'rightHand',hand=document.getElementById(handId),stage=document.getElementById('handsStage'),r=stage.getBoundingClientRect(),key=keyEl.getBoundingClientRect(),[ax,ay]=pressedTipAnchors[id];hand.style.backgroundImage=`url("${keyboardAsset(poseNames[id])}")`;const homeX=(id[0]==='l'?0:r.width/2)+ax*r.width/1920,homeY=ay*r.height/819;const targetX=key.left+key.width/2-r.left,targetY=key.top+key.height/2-r.top;hand.style.transform=`translate(${targetX-homeX}px,${targetY-homeY}px)`}
new ResizeObserver(()=>{for(const [id,keyEl] of activeHandPoses)showHandPose(id,keyEl)}).observe(document.getElementById('keyboard-deck'));
function resetHands(){activeHandPoses.clear();for(const side of ['left','right']){const hand=document.getElementById(side+'Hand');hand.style.backgroundImage=`url("${keyboardAsset('idle')}")`;hand.style.transform=''}}
function setMouseFrame(rightClick=false){mouseHand.style.backgroundImage=`url("${mouseAsset(rightClick)}")`}
function onDown(e){if(!active||e.repeat)return;const k=e.key.toLowerCase(),label=displayKey(e);const el=codeEls.get(e.code)||keyEls.get(k)||keyEls.get(label.toLowerCase());if(el)el.classList.add('down');keyEvent.textContent='最近按键：'+label;for(const id of mappedFingers(k))showHandPose(id,el)}
function onUp(e){const label=displayKey(e),el=codeEls.get(e.code)||keyEls.get(e.key.toLowerCase())||keyEls.get(label.toLowerCase());if(el)el.classList.remove('down');resetHands()}
if(!window.chrome?.webview){window.addEventListener('keydown',onDown);window.addEventListener('keyup',onUp)}
const pad=document.getElementById('mousepad'),mouse=document.getElementById('mouse'),mouseHand=document.getElementById('mouseHand');
const skinSelect=document.getElementById('skinSelect');
function applySkin(skin){activeSkin=skin;resetHands();mouseHand.classList.remove('left-click','right-click');setMouseFrame()}
skinSelect.addEventListener('change',()=>applySkin(skinSelect.value));
applySkin(skinSelect.value);
function showMouseAt(x,y){const r=pad.getBoundingClientRect(),px=x*r.width,py=y*r.height;mouse.style.left=px+'px';mouse.style.top=py+'px';mouseHand.style.left=px+'px';mouseHand.style.top=py+'px'}
pad.addEventListener('pointermove',e=>{const r=pad.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;mouse.style.left=x+'px';mouse.style.top=y+'px';mouseHand.style.left=x+'px';mouseHand.style.top=y+'px';mouseEvent.textContent=`位置：${Math.round(x)}, ${Math.round(y)}`});
pad.addEventListener('pointerdown',e=>{mouse.classList.add('click');mouseHand.classList.remove('left-click','right-click');if(e.button===0)mouseHand.classList.add('left-click');else if(e.button===2)mouseHand.classList.add('right-click');setMouseFrame(e.button===2);mouseEvent.textContent='鼠标按下 · '+(e.button===0?'左键':e.button===2?'右键':'中键')});
window.addEventListener('pointerup',()=>{mouse.classList.remove('click');mouseHand.classList.remove('left-click','right-click');setMouseFrame()});
pad.addEventListener('wheel',e=>{mouseHand.classList.remove('scroll-wheel');void mouseHand.offsetWidth;mouseHand.classList.add('scroll-wheel');mouseEvent.textContent='滚轮：'+(e.deltaY<0?'向上':'向下');setTimeout(()=>mouseHand.classList.remove('scroll-wheel'),520)},{passive:true});pad.addEventListener('contextmenu',e=>e.preventDefault());
const nativeDown=new Set();
window.addEventListener('nativeinput',e=>{const d=e.detail;if(d.kind==='key'){if(d.phase==='down')nativeDown.add(d.code);else nativeDown.delete(d.code);const ev=new KeyboardEvent(d.phase==='down'?'keydown':'keyup',{key:d.key,code:d.code,ctrlKey:nativeDown.has('ControlLeft')||nativeDown.has('ControlRight'),shiftKey:nativeDown.has('ShiftLeft')||nativeDown.has('ShiftRight'),altKey:nativeDown.has('AltLeft')||nativeDown.has('AltRight'),metaKey:nativeDown.has('MetaLeft')||nativeDown.has('MetaRight')});if(d.phase==='down')onDown(ev);else onUp(ev)}else if(d.kind==='mouse'){showMouseAt(d.x,d.y);if(d.phase==='move')return;if(d.phase==='down'){mouse.classList.add('click');mouseHand.classList.remove('left-click','right-click');if(d.button==='left')mouseHand.classList.add('left-click');else if(d.button==='right')mouseHand.classList.add('right-click');setMouseFrame(d.button==='right');mouseEvent.textContent='鼠标按下 · '+(d.button==='left'?'左键':d.button==='right'?'右键':'中键')}else if(d.phase==='up'){mouse.classList.remove('click');mouseHand.classList.remove('left-click','right-click');setMouseFrame()}else if(d.phase==='wheel-up'||d.phase==='wheel-down'){mouseHand.classList.remove('scroll-wheel');void mouseHand.offsetWidth;mouseHand.classList.add('scroll-wheel');mouseEvent.textContent='滚轮：'+(d.phase==='wheel-up'?'向上':'向下');setTimeout(()=>mouseHand.classList.remove('scroll-wheel'),520)}}});
</script>
</body>
</html>
